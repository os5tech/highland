services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: highland_pm
      POSTGRES_USER: highland
      POSTGRES_PASSWORD: highland
    ports:
      - "5432:5432"
    volumes:
      - highland-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highland -d highland_pm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  highland-postgres:
